<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<style>
html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
#wrap { position:fixed; left:16px; bottom:14px; z-index:99999;
  perspective: 600px; pointer-events:none; }
#card { width:190px; height:190px; border-radius:50%;
  background: radial-gradient(circle at 30% 25%, #ff9a9e, #fad0c4 45%, #a18cd1 100%);
  padding:5px; box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.25);
  transform-style: preserve-3d; animation: floaty 4s ease-in-out infinite;
  position:relative; }
#card img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
  border:3px solid #fff; }
#ring { position:absolute; inset:-8px; border-radius:50%;
  border:3px solid rgba(233,30,99,.55); animation: pulse 2.2s ease-in-out infinite; }
#name { margin-top:10px; text-align:center; color:#fff; font-family:'Segoe UI',Tahoma,sans-serif;
  font-size:.85rem; font-weight:700; background:rgba(173,20,87,.92); border-radius:20px;
  padding:4px 14px; display:inline-block; box-shadow:0 4px 12px rgba(0,0,0,.25); }
.center { text-align:center; }
.speaking #card { animation: talk 0.4s ease-in-out infinite alternate, floaty 4s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes talk { from { transform: scale(1); } to { transform: scale(1.04); } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity:.9; }
  50% { transform: scale(1.07); opacity:.45; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div id="ring"></div>
    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&q=80" alt="ليال">
  </div>
  <div class="center"><div id="name">ليال 🦸‍♀️</div></div>
</div>
<script>
(function(){
  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');

  // ---------- إطالة الـ iframe ليعوم على يسار الشاشة ----------
  function fixFrame(){
    if (window.frameElement) {
      var f = window.frameElement;
      f.style.position = 'fixed';
      f.style.left = '0px';
      f.style.bottom = '0px';
      f.style.width = '230px';
      f.style.height = '260px';
      f.style.zIndex = '99998';
      f.style.border = 'none';
      f.style.background = 'transparent';
      f.style.pointerEvents = 'none';
    }
  }
  fixFrame();
  setInterval(fixFrame, 300);

  // ---------- إمالة ثلاثية الأبعاد خفيفة مع حركة الماوس ----------
  document.addEventListener('mousemove', function(e){
    try {
      var r = wrap.getBoundingClientRect();
      var cx = r.left + r.width/2, cy = r.top + r.height/2;
      var dx = (e.clientX - cx) / 40, dy = (e.clientY - cy) / 40;
      card.style.transform = 'rotateY(' + (-dx) + 'deg) rotateX(' + dy + 'deg)';
    } catch(err) {}
  });
  document.addEventListener('mouseleave', function(){ card.style.transform = ''; });

  // ---------- الصوت: أنثى عربية عبر Google TTS، مع احتياط المتصفح ----------
  var audio = new Audio();
  var pending = null;
  var speaking = false;

  function setSpeaking(on){
    speaking = on;
    card.parentElement.parentElement.classList.toggle('speaking', on);
  }

  function browserFallback(text){
    try {
      var vs = speechSynthesis.getVoices();
      var v = vs.filter(function(x){ return x.lang && x.lang.indexOf('ar') === 0; })[0];
      if (!v) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.voice = v; u.lang = v.lang; u.rate = 1.02;
      u.onstart = function(){ setSpeaking(true); };
      u.onend = function(){ setSpeaking(false); };
      speechSynthesis.speak(u);
    } catch(e) {}
  }

  function speak(text){
    try {
      var last = null;
      try { last = localStorage.getItem('lyal_last'); } catch(e) {}
      if (last === text) return;
      try { localStorage.setItem('lyal_last', text); } catch(e) {}
      audio.onerror = function(){ setSpeaking(false); browserFallback(text); };
      audio.onended = function(){ setSpeaking(false); };
      audio.onplay = function(){ setSpeaking(true); };
      audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=' +
                  encodeURIComponent(text);
      var p = audio.play();
      if (p && p.catch) {
        p.catch(function(){ setSpeaking(false); pending = text; });
      }
    } catch(e) {}
  }

  // أول نقرة/لمسة بتشغّل الرسالة المعلّقة (المتصفح بمنع الصوت قبل تفاعل)
  document.addEventListener('click', function once(){
    if (pending) { var t = pending; pending = null; speak(t); }
  }, { once:true });
  document.addEventListener('touchstart', function once(){
    if (pending) { var t = pending; pending = null; speak(t); }
  }, { once:true });

  // ---------- استقبال الرسائل من التطبيق ----------
  var ch = new BroadcastChannel('lyal');
  ch.onmessage = function(ev){
    if (ev.data && ev.data.msg) speak(ev.data.msg);
  };

  var initial = '__MSG__';
  if (initial) speak(initial);
})();
</script>
</body>
</html>
