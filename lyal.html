<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<style>
html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
#stage { position:fixed; left:6px; bottom:6px; width:260px; height:390px; z-index:99999; }
#stage canvas { border-radius: 16px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const G = 'https://cdn.jsdelivr.net/gh/mixman222/lbn-realestate@master/models/';
const AVATAR = G + 'low_poly_girl.glb';

// ---------- المشهد ----------
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 260/390, 0.1, 50);
camera.position.set(0, 0.85, 3.2);
camera.lookAt(0, 0.9, 0);

// كاميرا تلقائية تعتمد الأبعاد العالمية الحقيقية للجلد
// (Box3.setFromObject يرجع الصندوق المحلي فقط للنماذج المزيلة بالعظام)
let fitCounter = 0;
function skinnedBounds(obj){
  const box = new THREE.Box3();
  const v = new THREE.Vector3(), t = new THREE.Vector3();
  const m = new THREE.Matrix4();
  obj.updateMatrixWorld(true);
  let any = false;
  obj.traverse(o => {
    if (!o.isSkinnedMesh || !o.skeleton) return;
    const g = o.geometry;
    const pos = g.attributes.position;
    const gi = g.attributes.skinIndex, gw = g.attributes.skinWeight;
    const bones = o.skeleton.bones, invs = o.skeleton.boneInverses;
    const J = [0,0,0,0], W = [0,0,0,0];
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      let x = 0, y = 0, z = 0;
      J[0]=gi.getX(i); J[1]=gi.getY(i); J[2]=gi.getZ(i); J[3]=gi.getW(i);
      W[0]=gw.getX(i); W[1]=gw.getY(i); W[2]=gw.getZ(i); W[3]=gw.getW(i);
      for (let k = 0; k < 4; k++) {
        const b = J[k], w = W[k];
        if (!w || !bones[b]) continue;
        m.multiplyMatrices(bones[b].matrixWorld, invs[b]);
        t.copy(v).applyMatrix4(m);
        x += t.x*w; y += t.y*w; z += t.z*w;
      }
      box.expandByPoint(v.set(x, y, z));
    }
    any = true;
  });
  return any ? box : null;
}
function autoFit(){
  if (!avatar) return;
  try {
    const box = skinnedBounds(avatar) || new THREE.Box3().setFromObject(avatar);
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3());
    const dist = Math.max(s.y, 0.5) / (2 * Math.tan(THREE.MathUtils.degToRad(20))) * 1.25;
    camera.position.set(c.x, c.y, c.z + dist);
    camera.lookAt(c.x, c.y, c.z);
  } catch(e) {}
}
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
renderer.setSize(260, 390);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

// إضاءة ناعمة موحّدة حتى ما تظهر الراس داكنة كالخوذة
scene.add(new THREE.HemisphereLight(0xffffff, 0xdfd3c8, 1.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(1, 2, 1.5);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffe0d0, 0.6);
dl2.position.set(-1.5, 1, -1);
scene.add(dl2);

// ---------- إطالة الـ iframe ليعوم على يسار الشاشة ----------
function fixFrame(){
  if (window.frameElement) {
    const f = window.frameElement;
    f.style.position = 'fixed';
    f.style.left = '4px';
    f.style.bottom = '4px';
    f.style.width = '268px';
    f.style.height = '400px';
    f.style.zIndex = '99998';
    f.style.border = 'none';
    f.style.background = 'transparent';
    f.style.pointerEvents = 'none';
  }
}
fixFrame();
setInterval(fixFrame, 300);

// ---------- تحميل النموذج والحركات ----------
const loader = new GLTFLoader();
let avatar = null, mixer = null, mixerEyes = null;
let idleAction = null, talkAction = null;

function onAvatar(gltf){
  avatar = gltf.scene;
  avatar.traverse(o => {
    if (o.isMesh && o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { m.side = THREE.FrontSide; });
    }
  });
  scene.add(avatar);
  autoFit();
  mixer = new THREE.AnimationMixer(avatar);
  const clips = gltf.animations || [];
  const findClip = re => clips.filter(a => re.test(a.name || ''))[0];
  const idleC = findClip(/^idle$/i) || findClip(/^idle\s*2$/i) || findClip(/idle/i);
  const talkC = findClip(/cycle_talking/i);
  const blinkC = findClip(/expressions_blinking/i);
  if (idleC) { idleAction = mixer.clipAction(idleC); idleAction.play(); }
  if (talkC) { talkAction = mixer.clipAction(talkC); }
  if (blinkC) {
    mixerEyes = new THREE.AnimationMixer(avatar);
    mixerEyes.clipAction(blinkC).play();
  }
}

function loadAvatar(){
  loadTries++;
  loader.load(AVATAR, onAvatar, undefined, function(){
    if (loadTries < 2) setTimeout(loadAvatar, 2500);
  });
}
let loadTries = 0;
loadAvatar();

function setTalking(on){
  if (!mixer || !talkAction) return;
  if (on) {
    idleAction.fadeOut(0.3);
    talkAction.reset().fadeIn(0.3).play();
  } else {
    talkAction.fadeOut(0.3);
    idleAction.reset().play();
  }
}

function tick(t){
  if (mixer) mixer.update(1/60);
  if (mixerEyes) mixerEyes.update(1/60);
  if (avatar) {
    avatar.position.y = 0 + Math.sin(t*0.0016)*0.03;
    avatar.rotation.y = Math.sin(t*0.0004)*0.25;
    if (++fitCounter % 15 === 0) autoFit();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- الصوت: يُشغَّل في صفحة الوالد (لأن المتصفح بيمنع الصوت داخل الإطار) ----------
const parentDoc = (function(){ try { return window.parent.document; } catch(e){ return null; } })();
const localAudio = new Audio();
let pending = null;

function browserFallback(text){
  try {
    const vs = speechSynthesis.getVoices();
    const v = vs.filter(x => x.lang && x.lang.indexOf('ar') === 0)[0];
    if (!v) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = 1.02;
    u.onstart = function(){ setTalking(true); };
    u.onend = function(){ setTalking(false); };
    speechSynthesis.speak(u);
  } catch(e) {}
}

function attachHandlers(a, text){
  a.onplay = function(){ setTalking(true); lyalLast = text; };
  a.onended = function(){ setTalking(false); };
  a.onerror = function(){ setTalking(false); browserFallback(text); };
}

function playWithElement(a, text){
  attachHandlers(a, text);
  a.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=' +
          encodeURIComponent(text);
  const p = a.play();
  if (p && p.catch) p.catch(function(){ setTalking(false); pending = text; });
}

let lyalLast = null;
try { localStorage.removeItem('lyal_last'); } catch(e) {}

function speak(text){
  try {
    if (lyalLast === text) return;

    if (parentDoc) {
      let a = parentDoc.getElementById('lyal_audio');
      if (!a) {
        a = parentDoc.createElement('audio');
        a.id = 'lyal_audio';
        a.style.display = 'none';
        parentDoc.body.appendChild(a);
      }
      playWithElement(a, text);
      return;
    }
    playWithElement(localAudio, text);
  } catch(e) {}
}

function tryPending(){
  if (!pending) return;
  const t = pending; pending = null;
  speak(t);
}

// أول نقرة بأي مكان بالصفحة (الوالد) بتشغّل الترحيب المعلّق
if (parentDoc) {
  parentDoc.addEventListener('click', tryPending, { passive:true });
  parentDoc.addEventListener('touchstart', tryPending, { passive:true });
  parentDoc.addEventListener('keydown', tryPending, { passive:true });
} else {
  document.addEventListener('click', tryPending);
}

// ---------- استقبال الرسائل من التطبيق ----------
const ch = new BroadcastChannel('lyal');
ch.onmessage = function(ev){
  if (ev.data && ev.data.msg) speak(ev.data.msg);
};

const initial = '__MSG__';
if (initial) speak(initial);
</script>
</body>
</html>
