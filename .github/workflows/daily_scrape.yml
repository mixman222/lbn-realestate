name: Daily Scrape

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "إرسال التقرير الأسبوعي الآن (بدل انتظار الجمعة)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_all.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --cached --quiet || git commit -m "Daily scrape: $(date +'%Y-%m-%d')"
          git push

  weekly-report:
    runs-on: ubuntu-latest
    needs: scrape
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Send weekly report
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          BREVO_LIST_ID: "3"
          FORCE_REPORT: ${{ inputs.force_report == true && '1' || '0' }}
        run: python send_report.py

